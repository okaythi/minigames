<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="60%" stop-color="#23170e"/>
      <stop offset="100%" stop-color="#120b06"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Tatami Mat Lines -->
  <g stroke="rgba(0,0,0,0.3)" stroke-width="2">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
  </g>

  <!-- Red Center Ring -->
  <circle cx="300" cy="200" r="130" fill="#8c261e" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="300" cy="200" r="100" fill="none" stroke="rgba(255,213,79,0.3)" stroke-width="2"/>

  <!-- Elemental Icons Trio -->
  <!-- Fire (Top) -->
  <circle cx="300" cy="135" r="28" fill="#e53935" stroke="#ffebee" stroke-width="2"/>
  <text x="300" y="145" font-size="28" text-anchor="middle">🔥</text>

  <!-- Water (Bottom Right) -->
  <circle cx="360" cy="235" r="28" fill="#1e88e5" stroke="#e1f5fe" stroke-width="2"/>
  <text x="360" y="245" font-size="28" text-anchor="middle">💧</text>

  <!-- Snow (Bottom Left) -->
  <circle cx="240" cy="235" r="28" fill="#00acc1" stroke="#e0f7fa" stroke-width="2"/>
  <text x="240" y="245" font-size="28" text-anchor="middle">❄️</text>

  <!-- Title Banner -->
  <rect x="150" y="320" width="300" height="50" rx="8" fill="#1a1109" stroke="#b07e44" stroke-width="2"/>
  <text x="300" y="354" font-family="'Comic Sans MS', system-ui, sans-serif" font-weight="900" font-size="26" fill="#ffd54f" text-anchor="middle" letter-spacing="2">
    CARD-JITSU
  </text>
</svg>
